<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>贪吃蛇 Snake</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px 12px 24px;
    touch-action: none; overscroll-behavior: none;
  }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .hud {
    display: flex; gap: 24px; margin: 8px 0 12px;
    font-size: 16px;
  }
  .hud b { color: #4ade80; font-variant-numeric: tabular-nums; }
  .board-wrap { position: relative; width: min(92vw, 400px); }
  canvas {
    width: 100%; aspect-ratio: 1 / 1; display: block;
    background: #111827; border: 2px solid #334155; border-radius: 12px;
  }
  .overlay {
    position: absolute; inset: 0; border-radius: 12px;
    background: rgba(2, 6, 23, 0.78);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 26px; font-weight: 700; }
  .overlay .sub { font-size: 14px; color: #94a3b8; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
    background: #22c55e; color: #052e16; font-weight: 700;
    padding: 10px 22px; font-size: 16px;
  }
  button:active { transform: scale(0.97); }
  .controls {
    margin-top: 14px; display: grid; gap: 8px;
    grid-template-columns: repeat(3, 64px);
    grid-template-areas: ". up ." "left down right";
    justify-content: center;
  }
  .controls button {
    background: #1e293b; color: #e2e8f0; height: 56px; font-size: 22px; padding: 0;
    border: 1px solid #334155;
  }
  .c-up { grid-area: up; } .c-left { grid-area: left; }
  .c-down { grid-area: down; } .c-right { grid-area: right; }
  .row { margin-top: 14px; display: flex; gap: 10px; }
  .row button.secondary { background: #334155; color: #e2e8f0; }
  .tip { margin-top: 12px; font-size: 12px; color: #64748b; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="hud">
    <div>得分 <b id="score">0</b></div>
    <div>最高 <b id="best">0</b></div>
    <div>速度 <b id="level">1</b></div>
  </div>

  <div class="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="ovTitle">准备开始</div>
      <div class="sub" id="ovText">滑动屏幕、点方向键或用键盘方向键控制蛇。<br>吃到食物变长，撞墙或撞到自己结束。</div>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="controls">
    <button class="c-up" data-dir="up" aria-label="上">▲</button>
    <button class="c-left" data-dir="left" aria-label="左">◀</button>
    <button class="c-down" data-dir="down" aria-label="下">▼</button>
    <button class="c-right" data-dir="right" aria-label="右">▶</button>
  </div>

  <div class="row">
    <button class="secondary" id="pauseBtn">暂停</button>
    <button class="secondary" id="restartBtn">重开</button>
  </div>

  <p class="tip">内测版：把这个文件发到手机/电脑上用浏览器打开即可玩。<br>iPhone 可在 Safari 里选“添加到主屏幕”，当成 app 一样打开。</p>

<script>
(function () {
  var COLS = 20, ROWS = 20;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var cell = canvas.width / COLS;

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var levelEl = document.getElementById('level');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var startBtn = document.getElementById('startBtn');

  var DIRS = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
  var OPP = { up:'down', down:'up', left:'right', right:'left' };

  var snake, dir, nextDir, food, score, best, speed, timer, state;
  best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
  bestEl.textContent = best;
  state = 'ready';

  function reset() {
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = 'right'; nextDir = 'right';
    score = 0;
    speed = 160;
    placeFood();
    updateHud();
  }

  function placeFood() {
    while (true) {
      var f = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
      var hit = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!hit) { food = f; return; }
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = Math.max(1, Math.round((170 - speed) / 12) + 1);
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + DIRS[dir].x, y: snake[0].y + DIRS[dir].y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      gameOver();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (score > best) {
        best = score;
        localStorage.setItem('snakeBest', String(best));
      }
      if (speed > 70) { speed -= 6; restartTimer(); }
      placeFood();
    } else {
      snake.pop();
    }
    updateHud();
    draw();
  }

  function draw() {
    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(51,65,85,0.35)';
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*cell, 0); ctx.lineTo(i*cell, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*cell); ctx.lineTo(canvas.width, i*cell); ctx.stroke();
    }
    // food
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x*cell + cell/2, food.y*cell + cell/2, cell*0.38, 0, Math.PI*2);
    ctx.fill();
    // snake
    snake.forEach(function (s, idx) {
      ctx.fillStyle = idx === 0 ? '#4ade80' : '#22c55e';
      var pad = idx === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(s.x*cell + pad, s.y*cell + pad, cell - pad*2, cell - pad*2, 4);
      ctx.fill();
      if (idx === 0) {
        ctx.fillStyle = '#052e16';
        ctx.beginPath();
        ctx.arc(s.x*cell + cell*0.36, s.y*cell + cell*0.4, 2, 0, Math.PI*2);
        ctx.arc(s.x*cell + cell*0.64, s.y*cell + cell*0.4, 2, 0, Math.PI*2);
        ctx.fill();
      }
    });
  }

  function restartTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(step, speed);
  }

  function start() {
    reset();
    state = 'playing';
    overlay.classList.add('hidden');
    draw();
    restartTimer();
  }

  function gameOver() {
    state = 'over';
    if (timer) clearInterval(timer);
    ovTitle.textContent = '游戏结束';
    ovText.innerHTML = '本局得分 <b style="color:#4ade80">' + score + '</b>，最高纪录 ' + best + '。<br>点下面按钮再来一局。';
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
    draw();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      if (timer) clearInterval(timer);
      ovTitle.textContent = '已暂停';
      ovText.textContent = '点下面按钮继续。';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      overlay.classList.add('hidden');
      restartTimer();
    }
  }

  function setDir(d) {
    if (state !== 'playing') return;
    if (OPP[dir] !== d) nextDir = d;
  }

  startBtn.addEventListener('click', function () {
    if (state === 'paused') { togglePause(); } else { start(); }
  });
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('restartBtn').addEventListener('click', function () { start(); });

  document.querySelectorAll('.controls button').forEach(function (b) {
    b.addEventListener('touchstart', function (e) { e.preventDefault(); setDir(b.dataset.dir); }, { passive: false });
    b.addEventListener('mousedown', function () { setDir(b.dataset.dir); });
  });

  document.addEventListener('keydown', function (e) {
    var map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
                w:'up', s:'down', a:'left', d:'right' };
    if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
    if (e.key === ' ' ) { e.preventDefault(); state === 'playing' || state === 'paused' ? togglePause() : start(); }
  });

  var touchStart = null;
  document.addEventListener('touchstart', function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!touchStart || state !== 'playing') return;
    var dx = e.touches[0].clientX - touchStart.x;
    var dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touchStart = null;
  }, { passive: true });

  reset();
  draw();
})();
</script>
</body>
</html>
